name: CI

# Triggers:
# - Pull requests targeting the default branch (main).
# - Pushes to the default branch (main).
# - Pushes to add-animal, while CI is being established on this branch.
# - Manual dispatch.
#
# Note: a push to add-animal while a PR from add-animal into main is open
# will trigger both the `push` and `pull_request` events for the same
# commit (two separate runs, different concurrency groups/refs). This is a
# known, intentional trade-off while add-animal is explicitly listed as a
# push trigger; remove the add-animal push trigger once that branch is
# merged to avoid the duplicate run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, add-animal]
  workflow_dispatch: {}

# Default token permissions are read-only; jobs that need more request it
# explicitly (none currently do - this workflow never publishes or deploys).
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. repeated pushes to the same
# branch) to avoid piling up redundant identical jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      # global.json (FarmStats/global.json) pins the exact SDK version; this
      # just has to be able to see it and will install a matching SDK.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5
        with:
          global-json-file: FarmStats/global.json

      - name: Restore tools and solution
        run: scripts/ci/restore.sh

      - name: Check formatting (no rewrite)
        run: scripts/ci/format-check.sh

      - name: Build (Release)
        run: scripts/ci/build.sh

      - name: Verify Docker access for Testcontainers
        run: docker info

      - name: Run PostgreSQL integration tests (Release)
        run: scripts/ci/test.sh "${{ github.workspace }}/test-results"

      - name: Check for model changes missing a migration
        run: scripts/ci/check-migrations.sh

      # Upload diagnostics even when an earlier step failed, so a failing
      # run is still debuggable from the Actions UI.
      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            test-results/**
            FarmStats/tests/**/bin/Release/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Security (secrets + dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately no extra permissions: this job never needs to write to
    # the repo, publish packages, or deploy anything.
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: scripts/ci/gitleaks-scan.sh "${{ github.workspace }}/gitleaks-report.json"

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5
        with:
          global-json-file: FarmStats/global.json

      # Fails the job on high/critical (or unresolvable) vulnerability
      # advisories across direct and transitive NuGet dependencies.
      - name: Dependency vulnerability audit (NuGet, high/critical)
        run: scripts/ci/security-audit.sh

  container-build:
    name: Container build (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    # No registry credentials are configured or available to this job; it
    # only proves the image builds, it never pushes anywhere.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      # The Dockerfile's COPY paths only resolve correctly when the build
      # context is FarmStats/src (NOT the compose.yaml-declared "." context,
      # which is FarmStats/ and does not currently build - see the
      # completion report for details). Verified locally: building from
      # FarmStats/src succeeds; building from FarmStats/ fails with
      # "FarmStats.API/FarmStats.API.csproj: not found".
      - name: Build container image (build-only, no push)
        working-directory: FarmStats/src
        run: |
          docker build \
            --file FarmStats.API/Dockerfile \
            --tag farmstats-api:ci \
            .
